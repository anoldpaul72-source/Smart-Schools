services:
  - type: web
    name: smart-schools
    runtime: docker
    plan: free
    region: oregon
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: Smart-Results
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
